trigger: none
pr: none

variables:
  - group: aks-practice-vars

stages:
  - stage: TerraformPlan
    displayName: Terraform plan
    jobs:
      - job: Plan
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # install terraform via HashiCorp apt repository
                sudo apt-get update -y
                sudo apt-get install -y gnupg curl lsb-release
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                sudo apt-get update -y
                sudo apt-get install -y terraform
                terraform -version
                cd infra
                terraform init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(Build.Repository.Name).tfstate"
                # Import existing AKS cluster if it exists
                terraform import module.aks.azurerm_kubernetes_cluster.aks /subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroupName)/providers/Microsoft.ContainerService/managedClusters/$(aksClusterName) || echo "Cluster import skipped"
                terraform import module.aks.azurerm_kubernetes_cluster_node_pool.user /subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroupName)/providers/Microsoft.ContainerService/managedClusters/$(aksClusterName)/agentPools/user || echo "Node pool import skipped"
                terraform plan -var="subscription_id=$(subscriptionId)" -var="tenant_id=$(tenantId)" -var="create_rbac_role_assignments=false" -out=tfplan
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'infra/tfplan'
              artifact: 'tfplan'

  - stage: TerraformApply
    displayName: Terraform apply
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        environment: infra-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'tfplan'
                    path: 'infra'
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # install terraform via HashiCorp apt repository
                      sudo apt-get update -y
                      sudo apt-get install -y gnupg curl lsb-release
                      curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                      echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                      sudo apt-get update -y
                      sudo apt-get install -y terraform
                      terraform -version
                      cd infra
                      terraform init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(Build.Repository.Name).tfstate"
                      terraform apply tfplan


trigger:
  - main
pr:
  - none

variables:
  - group: aks-practice-vars
  - name: terraformStateKey
    value: terraform.tfstate

stages:
  - stage: TerraformPlan
    displayName: Terraform plan
    jobs:
      - job: Plan
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Force Unlock Terraform State'
            condition: and(succeeded(), eq(variables['forceUnlock'], 'true'), ne(variables['lockId'], ''))
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                cd infra
                terraform init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(terraformStateKey)"
                STATE_BLOB="$(terraformStateKey)"
                LOCK_ID="$(lockId)"
                ACTUAL_LOCK_ID=$(az storage blob metadata show --account-name "$(backendStorageAccount)" --container-name "$(backendContainer)" --name "$STATE_BLOB" --auth-mode login --query "terraformlockid" -o tsv 2>/dev/null || true)
                if [[ -z "$ACTUAL_LOCK_ID" ]]; then
                  echo "No Terraform lock metadata found on $STATE_BLOB; skipping force-unlock."
                  exit 0
                fi
                if [[ "$ACTUAL_LOCK_ID" != "$LOCK_ID" ]]; then
                  echo "Refusing to unlock: requested lock $LOCK_ID does not match backend lock $ACTUAL_LOCK_ID."
                  exit 1
                fi
                echo "Force unlocking verified stale lock: $ACTUAL_LOCK_ID"
                terraform force-unlock -force "$ACTUAL_LOCK_ID"
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # install terraform via HashiCorp apt repository
                sudo apt-get update -y
                sudo apt-get install -y gnupg curl lsb-release
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                sudo apt-get update -y
                sudo apt-get install -y terraform
                terraform -version
                cd infra
                terraform init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(terraformStateKey)"
                terraform plan -var="subscription_id=$(subscriptionId)" -var="tenant_id=$(tenantId)" -var="create_rbac_role_assignments=true" -out=tfplan
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'infra/tfplan'
              artifact: 'tfplan'

  - stage: TerraformApply
    displayName: Terraform apply
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        environment: infra-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'tfplan'
                    path: 'infra'
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # install terraform via HashiCorp apt repository
                      sudo apt-get update -y
                      sudo apt-get install -y gnupg curl lsb-release
                      curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                      echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                      sudo apt-get update -y
                      sudo apt-get install -y terraform
                      terraform -version
                      cd infra
                      terraform init -backend-config="resource_group_name=$(backendResourceGroup)" -backend-config="storage_account_name=$(backendStorageAccount)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(terraformStateKey)"
                      terraform apply tfplan
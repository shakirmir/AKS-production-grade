trigger:
  - main

pr:
  - main

variables:
  - group: aks-practice-vars

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: BuildImage
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name $(acrName)
                docker build -t $(acrLoginServer)/aks-practice-app:$(Build.BuildId) app
                docker push $(acrLoginServer)/aks-practice-app:$(Build.BuildId)

  - stage: DeployUAT
    displayName: Deploy to UAT
    dependsOn: Build
    jobs:
      - deployment: DeployUAT
        environment: uat-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      # Deploy NGINX ingress controller
                      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                      helm repo update
                      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
                      # Wait for NGINX ingress controller to be ready
                      kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=ingress-nginx -n ingress-nginx --timeout=300s
                      helm upgrade --install aks-practice-app ./charts/aks-practice-app -n uat --create-namespace -f charts/aks-practice-app/values-uat.yaml --set image.tag=$(Build.BuildId) --set image.repository=$(acrLoginServer)/aks-practice-app

  - stage: DeployProdGreen
    displayName: Deploy green to production
    dependsOn: DeployUAT
    jobs:
      - deployment: DeployProdGreen
        environment: prod-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      # Deploy NGINX ingress controller
                      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                      helm repo update
                      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
                      # Wait for NGINX ingress controller to be ready
                      kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=ingress-nginx -n ingress-nginx --timeout=300s
                      helm upgrade --install aks-practice-app ./charts/aks-practice-app -n production --create-namespace -f charts/aks-practice-app/values-production.yaml --set version=green --set service.selectorVersion=green --set image.tag=$(Build.BuildId) --set image.repository=$(acrLoginServer)/aks-practice-app
                      # Wait for pods to be ready
                      kubectl wait --for=condition=ready pod -l app=aks-practice-app,version=green -n production --timeout=300s
                      # Diagnostic checks
                      echo "=== Pod Status ==="
                      kubectl get pods -n production -l app=aks-practice-app
                      echo "=== Service Endpoints ==="
                      kubectl get endpoints aks-practice-app -n production
                      echo "=== Ingress Status ==="
                      kubectl get ingress aks-practice-app -n production
                      echo "=== NGINX Ingress Controller Status ==="
                      kubectl get pods -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
                      echo "=== NGINX LoadBalancer Service Status ==="
                      kubectl get svc ingress-nginx-controller -n ingress-nginx -o yaml
                      echo "=== Testing direct NGINX pod access ==="
                      NGINX_POD=$(kubectl get pods -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx -o jsonpath='{.items[0].metadata.name}')
                      kubectl exec -n ingress-nginx $NGINX_POD -- curl -s localhost:10245/healthz || echo "NGINX health endpoint not accessible"
                      echo "=== Ingress Resource Status ==="
                      kubectl get ingress aks-practice-app -n production -o yaml
                      echo "=== Service Endpoints ==="
                      kubectl get endpoints aks-practice-app -n production
                      # Get NGINX ingress controller LoadBalancer IP for smoke test
                      INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                      echo "=== Testing NGINX Ingress at $INGRESS_IP ==="
                      if [ -z "$INGRESS_IP" ]; then
                        echo "ERROR: No external IP assigned to LoadBalancer"
                        exit 1
                      fi
                      # Wait for ingress to propagate
                      echo "Waiting for ingress to propagate..."
                      sleep 30
                      # Retry health check with better error handling
                      for i in {1..5}; do
                        echo "Attempt $i: Testing health endpoint..."
                        if curl -fsS "http://$INGRESS_IP/healthz" -H "Host: prod.example.internal" --max-time 10; then
                          echo "Health check passed!"
                          exit 0
                        fi
                        echo "Health check failed, waiting 10s before retry..."
                        sleep 10
                      done
                      echo "Health check failed after 5 attempts"
                      exit 1

  - stage: SwapToGreen
    displayName: Swap traffic to green
    dependsOn: DeployProdGreen
    jobs:
      - deployment: SwapToGreen
        environment: prod-swap-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      kubectl -n production patch service aks-practice-app --type='json' -p='[{"op": "replace", "path": "/spec/selector/version", "value": "green"}]'

  - stage: RollbackToBlue
    displayName: Rollback to blue
    dependsOn: []
    jobs:
      - deployment: Rollback
        environment: prod-rollback
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      kubectl -n production patch service aks-practice-app --type='json' -p='[{"op": "replace", "path": "/spec/selector/version", "value": "blue"}]'

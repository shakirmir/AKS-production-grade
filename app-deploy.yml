trigger:
  - main

pr:
  - main

variables:
  - group: aks-practice-vars

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: BuildImage
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name $(acrName)
                docker build -t $(acrLoginServer)/aks-practice-app:$(Build.BuildId) app
                docker push $(acrLoginServer)/aks-practice-app:$(Build.BuildId)

  - stage: DeployUAT
    displayName: Deploy to UAT
    dependsOn: Build
    jobs:
      - deployment: DeployUAT
        environment: uat-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      KEY_VAULT_NAME=$(az keyvault list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
                      WORKLOAD_IDENTITY_CLIENT_ID=$(az identity list --resource-group $(resourceGroupName) --query "[?contains(name, 'workload-id')].clientId | [0]" -o tsv)
                      test -n "$KEY_VAULT_NAME"
                      test -n "$WORKLOAD_IDENTITY_CLIENT_ID"
                      # Ensure the AKS addon that installs SecretProviderClass is enabled before Helm.
                      KEYVAULT_ADDON=$(az aks show --name $(aksClusterName) --resource-group $(resourceGroupName) --query "addonProfiles.azureKeyvaultSecretsProvider.enabled" -o tsv)
                      if [[ "$KEYVAULT_ADDON" != "true" ]]; then
                        az aks enable-addons --addons azure-keyvault-secrets-provider --name $(aksClusterName) --resource-group $(resourceGroupName)
                      else
                        echo "Azure Key Vault Secrets Provider addon is already enabled."
                      fi
                      # Deploy the selected ingress architecture: NGINX plus Azure LoadBalancer
                      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                      helm repo update
                      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
                      # The AKS Key Vault Secrets Provider addon supplies this CRD.
                      kubectl wait --for=condition=established crd/secretproviderclasses.secrets-store.csi.x-k8s.io --timeout=180s
                      # Apply network policy to allow LoadBalancer traffic
                      kubectl apply -f manifests/network-policy.yaml
                      # Wait for NGINX ingress controller to be ready
                      kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=ingress-nginx -n ingress-nginx --timeout=300s
                      helm upgrade --install aks-practice-app ./charts/aks-practice-app -n uat --create-namespace -f charts/aks-practice-app/values-uat.yaml --set image.tag=$(Build.BuildId) --set image.repository=$(acrLoginServer)/aks-practice-app --set secretProvider.keyVaultName="$KEY_VAULT_NAME" --set secretProvider.tenantId="$(tenantId)" --set secretProvider.workloadIdentityClientId="$WORKLOAD_IDENTITY_CLIENT_ID"

  - stage: DeployProdGreen
    displayName: Deploy green to production
    dependsOn: DeployUAT
    jobs:
      - deployment: DeployProdGreen
        environment: prod-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      KEY_VAULT_NAME=$(az keyvault list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
                      WORKLOAD_IDENTITY_CLIENT_ID=$(az identity list --resource-group $(resourceGroupName) --query "[?contains(name, 'workload-id')].clientId | [0]" -o tsv)
                      test -n "$KEY_VAULT_NAME"
                      test -n "$WORKLOAD_IDENTITY_CLIENT_ID"
                      # Ensure the AKS addon that installs SecretProviderClass is enabled before Helm.
                      KEYVAULT_ADDON=$(az aks show --name $(aksClusterName) --resource-group $(resourceGroupName) --query "addonProfiles.azureKeyvaultSecretsProvider.enabled" -o tsv)
                      if [[ "$KEYVAULT_ADDON" != "true" ]]; then
                        az aks enable-addons --addons azure-keyvault-secrets-provider --name $(aksClusterName) --resource-group $(resourceGroupName)
                      else
                        echo "Azure Key Vault Secrets Provider addon is already enabled."
                      fi
                      # Deploy the selected ingress architecture: NGINX plus Azure LoadBalancer
                      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                      helm repo update
                      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
                      # The AKS Key Vault Secrets Provider addon supplies this CRD.
                      kubectl wait --for=condition=established crd/secretproviderclasses.secrets-store.csi.x-k8s.io --timeout=180s
                      # Apply network policy to allow LoadBalancer traffic
                      kubectl apply -f manifests/network-policy.yaml
                      # Wait for NGINX ingress controller to be ready
                      kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=ingress-nginx -n ingress-nginx --timeout=300s
                      helm upgrade --install aks-practice-app ./charts/aks-practice-app -n production --create-namespace -f charts/aks-practice-app/values-production.yaml --set version=green --set service.selectorVersion=green --set image.tag=$(Build.BuildId) --set image.repository=$(acrLoginServer)/aks-practice-app --set secretProvider.keyVaultName="$KEY_VAULT_NAME" --set secretProvider.tenantId="$(tenantId)" --set secretProvider.workloadIdentityClientId="$WORKLOAD_IDENTITY_CLIENT_ID"
                      # Wait for pods to be ready
                      kubectl wait --for=condition=ready pod -l app=aks-practice-app,version=green -n production --timeout=300s
                      # Diagnostic checks
                      echo "=== Pod Status ==="
                      kubectl get pods -n production -l app=aks-practice-app
                      echo "=== Service Endpoints ==="
                      kubectl get endpoints aks-practice-app -n production
                      echo "=== Ingress Status ==="
                      kubectl get ingress aks-practice-app -n production
                      echo "=== NGINX Ingress Controller Status ==="
                      kubectl get pods -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
                      echo "=== NGINX LoadBalancer Service Status ==="
                      kubectl get svc ingress-nginx-controller -n ingress-nginx -o yaml
                      echo "=== Testing application routing through NGINX ==="
                      NGINX_POD=$(kubectl get pods -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx -o jsonpath='{.items[0].metadata.name}')
                      kubectl exec -n ingress-nginx "$NGINX_POD" -- \
                        curl -fsS --max-time 10 -H "Host: prod.example.internal" http://127.0.0.1/healthz
                      echo "=== Ingress Resource Status ==="
                      kubectl get ingress aks-practice-app -n production -o yaml
                      echo "=== Service Endpoints ==="
                      kubectl get endpoints aks-practice-app -n production
                      # Verify the LoadBalancer received an IP. The required smoke test above
                      # runs inside the controller, because Microsoft-hosted agents are not a
                      # reliable source network for a public ingress reachability check.
                      INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                      echo "=== NGINX LoadBalancer IP: $INGRESS_IP ==="
                      if [ -z "$INGRESS_IP" ]; then
                        echo "ERROR: No external IP assigned to LoadBalancer"
                        exit 1
                      fi
                      echo "Ingress routing health check passed."

  - stage: SwapToGreen
    displayName: Swap traffic to green
    dependsOn: DeployProdGreen
    jobs:
      - deployment: SwapToGreen
        environment: prod-swap-approval
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      kubectl -n production patch service aks-practice-app --type='json' -p='[{"op": "replace", "path": "/spec/selector/version", "value": "green"}]'

  - stage: RollbackToBlue
    displayName: Rollback to blue
    dependsOn: []
    jobs:
      - deployment: Rollback
        environment: prod-rollback
        pool:
          vmImage: ubuntu-22.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
                      kubectl -n production patch service aks-practice-app --type='json' -p='[{"op": "replace", "path": "/spec/selector/version", "value": "blue"}]'
